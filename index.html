<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="דרום אמריקה 2026">
<title>דרום אמריקה · אביב 2026</title>
<meta name="description" content="מדריך הטיול האישי לארגנטינה, צ׳ילה ופטגוניה — אביב 2026">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#07131d;--panel:#0d2130;--panel2:#102a3b;--text:#f4f8fb;--muted:#9bb0bf;--line:#244254;--mint:#72e0c1;--blue:#8fc5ff;--sand:#ffd58a;--danger:#ff8996;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 90% -10%,#1d4a63 0,transparent 35%),var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.app{max-width:1180px;margin:auto;padding:18px 16px 110px}
.hero{min-height:390px;border:1px solid var(--line);border-radius:30px;padding:30px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,rgba(15,54,72,.42),rgba(3,12,19,.94)),radial-gradient(circle at 20% 10%,rgba(114,224,193,.3),transparent 34%),linear-gradient(135deg,#173d51,#08131e);overflow:hidden;position:relative}
.hero:before{content:"";position:absolute;width:360px;height:360px;border:1px solid rgba(255,255,255,.09);border-radius:50%;top:-160px;left:-100px}.eyebrow{color:var(--mint);font-weight:900;letter-spacing:.15em;font-size:.72rem}.hero h1{font-size:clamp(2.7rem,9vw,6.4rem);line-height:.92;margin:10px 0 14px;max-width:800px}.hero p{color:#d5e4ec;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:rgba(8,25,37,.75);border:1px solid var(--line);padding:8px 11px;border-radius:999px;font-size:.78rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.stat,.card{background:rgba(13,33,48,.92);border:1px solid var(--line);border-radius:20px}.stat{padding:16px}.stat strong{font-size:1.35rem;display:block}.muted{color:var(--muted)}
nav{position:sticky;top:8px;z-index:20;display:flex;gap:7px;overflow:auto;background:rgba(7,19,29,.86);backdrop-filter:blur(18px);padding:8px;border:1px solid var(--line);border-radius:18px;margin:16px 0}
nav button{border:0;background:transparent;color:var(--muted);padding:11px 14px;border-radius:12px;white-space:nowrap}nav button.active{background:#153348;color:white}
.section-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:25px 0 12px}.section-head h2{font-size:2rem;margin:3px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:18px}
.destination{padding:0;overflow:hidden}.destination-cover{height:130px;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,#1f536b,#10202e)}.destination:nth-child(3n+2) .destination-cover{background:linear-gradient(160deg,#3d5565,#142534)}.destination:nth-child(3n+3) .destination-cover{background:linear-gradient(160deg,#375e56,#10272b)}
.destination-cover h3{font-size:1.6rem;margin:4px 0}.destination-body{padding:17px}.destination p{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:#132c3d;color:white;border-radius:12px;padding:10px 13px}.btn.primary{background:var(--mint);color:#062018;border:0;font-weight:900}
.timeline{display:grid;gap:10px}.timeline-item{display:grid;grid-template-columns:52px 1fr;gap:14px}.num{width:42px;height:42px;border-radius:14px;background:#153449;display:grid;place-items:center;color:var(--mint);font-weight:900}.timeline-item h3{margin:0}.timeline-item p{margin:6px 0;color:var(--muted)}
.search{width:min(360px,100%);background:var(--panel);border:1px solid var(--line);color:white;border-radius:13px;padding:11px 13px}
.modal{position:fixed;inset:0;z-index:100;background:rgba(2,8,13,.87);display:grid;place-items:center;padding:14px}.modal-card{width:min(880px,100%);max-height:94vh;overflow:auto;background:#091925;border:1px solid var(--line);border-radius:28px}.modal-head{padding:24px;background:linear-gradient(140deg,#1f5067,#10222f)}.modal-head h2{font-size:2.4rem;margin:5px 0}.modal-body{padding:20px}.close{position:fixed;top:18px;left:18px;border:1px solid var(--line);background:#0b1c29;color:white;border-radius:999px;padding:10px 13px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:8px}.place{border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:13px}.place strong{display:block}.place small{color:var(--muted)}.place a{color:var(--blue);font-size:.78rem}
.checklist{display:grid;gap:8px}.checkrow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}.checkrow.done{opacity:.55;text-decoration:line-through}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:30px}
@media(max-width:760px){.app{padding:12px 11px 105px}.hero{min-height:440px;padding:22px}.stats{grid-template-columns:1fr 1fr}.grid,.columns{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}nav{position:fixed;bottom:8px;top:auto;left:8px;right:8px;margin:0}.destination-cover{height:150px}}
</style>
</head>
<body><div class="app">
<section class="hero">
<div class="eyebrow">SOUTH AMERICA · 2026</div>
<h1>דרום אמריקה<br>אביב 2026</h1>
<p>ארגנטינה · צ׳ילה · פטגוניה</p>
<div class="chips"><span class="chip">16.10–04.12</span><span class="chip">טיול סולו</span><span class="chip">טבע · טרקים · אוכל</span></div>
</section>
<div class="stats">
<div class="stat"><strong id="countdown">—</strong><span class="muted">ימים ליציאה</span></div>
<div class="stat"><strong>50</strong><span class="muted">ימים במסע</span></div>
<div class="stat"><strong id="doneCount">0</strong><span class="muted">משימות הושלמו</span></div>
<div class="stat"><strong>10</strong><span class="muted">תחנות מרכזיות</span></div>
</div>
<nav id="nav">
<button class="active" data-tab="home">בית</button><button data-tab="route">מסלול</button><button data-tab="places">יעדים</button><button data-tab="todo">לפני הטיסה</button><button data-tab="notes">הערות</button>
</nav>
<main id="content"></main>
<footer>דרום אמריקה · אביב 2026 · הנתונים נשמרים במכשיר</footer>
</div>
<script>
let DATA=null, tab='home';
const S={get:(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let checks=S.get('sa26-checks',{}), notes=S.get('sa26-notes','');
const tasks=['טיסות פנים מרכזיות','לינות בפטגוניה','מעבר לקרטרה אוסטרל','ביטוח נסיעות','eSIM','ציוד גשם ורוח','הורדת מסמכים אופליין','מזומן וכרטיס גיבוי','כביסה לפני טורס','הסעה ל־EZE'];
const mapLink=n=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function countdown(){const d=Math.max(0,Math.ceil((new Date(DATA.start+'T00:00:00')-Date.now())/86400000));document.getElementById('countdown').textContent=d}
function render(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const c=document.getElementById('content');
 if(tab==='home'){
   const next=DATA.stops.find(s=>s.start>=new Date().toISOString().slice(0,10))||DATA.stops[0];
   c.innerHTML=`<div class="section-head"><div><div class="eyebrow">TRIP CONTROL</div><h2>הכול במקום אחד</h2></div></div>
   <div class="grid"><article class="card"><h3>היעד הבא</h3><h2>${next.name}</h2><p>${next.dates} · ${next.country}</p><div class="chips">${next.highlights.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="actions"><button class="btn primary" onclick="openStop('${next.id}')">פתיחת המדריך</button></div></article>
   <article class="card"><h3>הפעולה הבאה</h3><p>${tasks.find(t=>!checks[t])||'כל המשימות המרכזיות סומנו'}</p><div class="actions"><button class="btn" onclick="setTab('todo')">לרשימת ההכנות</button></div></article></div>
   <div class="section-head"><div><div class="eyebrow">QUICK PICKS</div><h2>יעדים מרכזיים</h2></div></div>
   <div class="grid">${DATA.stops.slice(0,4).map(card).join('')}</div>`;
 }
 if(tab==='route') c.innerHTML=`<div class="section-head"><div><div class="eyebrow">ITINERARY</div><h2>המסלול המלא</h2></div></div><div class="timeline">${DATA.stops.map((s,i)=>`<article class="card timeline-item"><div class="num">${i+1}</div><div><h3>${s.name}</h3><p>${s.dates} · ${s.country}</p><p>${s.summary}</p><button class="btn" onclick="openStop('${s.id}')">פרטים והמלצות</button></div></article>`).join('')}</div>`;
 if(tab==='places') c.innerHTML=`<div class="section-head"><div><div class="eyebrow">DESTINATIONS</div><h2>לינה, אוכל ומה לעשות</h2></div><input class="search" id="search" placeholder="חיפוש יעד, מלון או מסעדה"></div><div class="grid" id="placeGrid">${DATA.stops.map(card).join('')}</div>`;
 if(tab==='todo') c.innerHTML=`<div class="section-head"><div><div class="eyebrow">PRE-TRIP</div><h2>לפני הטיסה</h2></div></div><div class="checklist">${tasks.map(t=>`<button class="checkrow ${checks[t]?'done':''}" onclick="toggleTask('${t.replaceAll("'","\\'")}')"><span>${checks[t]?'✓':'○'}</span><strong>${t}</strong></button>`).join('')}</div>`;
 if(tab==='notes') c.innerHTML=`<div class="section-head"><div><div class="eyebrow">NOTES</div><h2>הערות אישיות</h2></div></div><article class="card"><textarea id="notesArea" style="width:100%;min-height:320px;background:var(--panel2);color:white;border:1px solid var(--line);border-radius:14px;padding:14px" placeholder="מספרי הזמנה, כתובות, רעיונות...">${esc(notes)}</textarea><div class="actions"><button class="btn primary" onclick="saveNotes()">שמירה</button></div></article>`;
 if(tab==='places'){document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();document.getElementById('placeGrid').innerHTML=DATA.stops.filter(s=>JSON.stringify(s).toLowerCase().includes(q)).map(card).join('')}}
 document.getElementById('doneCount').textContent=Object.values(checks).filter(Boolean).length;
}
function card(s){return `<article class="destination card"><div class="destination-cover"><small>${s.country} · ${s.dates}</small><h3>${s.name}</h3></div><div class="destination-body"><p>${s.summary}</p><div class="chips">${s.highlights.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="actions"><button class="btn primary" onclick="openStop('${s.id}')">מדריך מלא</button></div></div></article>`}
function openStop(id){const s=DATA.stops.find(x=>x.id===id);const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<button class="close" onclick="this.parentElement.remove()">סגירה</button><article class="modal-card"><header class="modal-head"><div class="eyebrow">${s.country} · ${s.dates}</div><h2>${s.name}</h2><p>${s.summary}</p><div class="chips">${s.highlights.map(x=>`<span class="chip">${x}</span>`).join('')}</div></header><div class="modal-body"><div class="columns"><section><h3>🏨 איפה לישון</h3><div class="list">${s.stays.map(p=>placeRow(p)).join('')}</div></section><section><h3>🍽️ איפה לאכול</h3><div class="list">${s.food.map(p=>placeRow(p)).join('')}</div></section></div><section style="margin-top:18px"><h3>⭐ מה מומלץ</h3><div class="list">${s.things.map(x=>`<div class="place">${x}</div>`).join('')}</div></section></div></article>`;document.body.appendChild(modal);modal.onclick=e=>{if(e.target===modal)modal.remove()}}
function placeRow(p){return `<div class="place"><strong>${p[0]}</strong><small>${p[1]}</small><br><a href="${mapLink(p[0])}" target="_blank" rel="noopener">פתיחה ב־Google Maps</a></div>`}
function setTab(x){tab=x;render()}function toggleTask(t){checks[t]=!checks[t];S.set('sa26-checks',checks);render()}function saveNotes(){notes=document.getElementById('notesArea').value;S.set('sa26-notes',notes);alert('נשמר')}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
fetch('data.json').then(r=>r.json()).then(d=>{DATA=d;countdown();render()}).catch(()=>{document.getElementById('content').innerHTML='<article class="card">לא ניתן לטעון את data.json. יש להפעיל דרך GitHub Pages ולא לפתוח את הקובץ ישירות.</article>'});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
